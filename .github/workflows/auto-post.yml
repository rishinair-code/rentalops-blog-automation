name: Auto Post Blog
on:
  schedule:
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:

jobs:
  post-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh GSC cache
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
        run: python refresh_gsc_cache.py --force

      - name: Run blog poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python blog_poster.py

      - name: Commit posts and topics log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json posts/ data/gsc_cache/
          git add published_pillars.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Add new blog post and update topics log"
          git push

      - name: Push JSON to Main Website
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the main website repo
          git clone "https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/rishinair-code/rental-management-app.git" sync_repo

          # Make sure the destination folder exists, then copy the new JSON files
          mkdir -p sync_repo/posts
          cp posts/*.json sync_repo/posts/

          cd sync_repo

          # Check for changes, commit, and push
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Add new blog post from automation"
            git push
          else
            echo "No new posts to sync."
          fi
